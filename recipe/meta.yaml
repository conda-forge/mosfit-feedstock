{% set name = "mosfit" %}
{% set version = "2.0.1" %}
{% set sha256 = "c89bd13bcb3c786b6e2e238ebf9d6bdfcbf7b58777026f3cea2a6666de061e51" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - astrocats >=0.5.0
    - astropy-base >=7.1
    - dynesty >=3.1
    - emcee >=3.0.2
    - extinction >=0.2.2
    # astrocats imports GitPython, which refuses to import at all when
    # there is no git executable on PATH, so `import mosfit` needs one.
    - git
    - h5py >=3.8.0
    - inflect >=1.0.0
    - matplotlib-base >=3.0.0
    - nbstripout >=0.2.9
    - numba >=0.67.0
    - numexpr >=2.6.1
    - numpy >=2.3
    - palettable >=2.1.1
    - pandas >=2.2
    - schwimmbad >=0.4.2
    - scipy >=1.2
    - seaborn >=0.7.1
    - six >=1.0.0

test:
  imports:
    - mosfit
  source_files:
    - test.py
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
    - mosfit --version
    - python -c "import mosfit; assert mosfit.__version__ == '{{ version }}'"
    - python test.py

about:
  home: https://github.com/guillochon/mosfit
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Modular fitter for astrophysical transients
  description: |
    MOSFiT fits semi-analytical model predictions to observed astrophysical
    transients. MOSFiT 2 reads event data from local catalog-format JSON or
    ASCII files; it no longer downloads events from the Open Astronomy
    catalogs or uploads fits. The default sampler is dynesty. PyTorch (for the
    SESN SEDONA model) and mpi4py are optional extras rather than required run
    dependencies.
  doc_url: https://mosfit.readthedocs.io/
  dev_url: https://github.com/guillochon/mosfit

extra:
  recipe-maintainers:
    - gmzsebastian
    - guillochon
    - mnicholl
    - pkgw
